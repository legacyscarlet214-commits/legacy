<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reyhan Analisis Muda</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --bg-0:#05070c;
    --bg-1:#0a1220;
    --line-red:#fa0830;
    --line-red-soft:rgba(184, 9, 12, 0.35);
    --silver:#cdd8e6;
    --silver-dim:#7f8ea3;
    --white:#f4f7fb;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--bg-0);
    color:var(--white);
    font-family:'Work Sans', sans-serif;
  }

  body{
    position:relative;
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  .grid-bg{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(var(--line-red-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-red-soft) 1px, transparent 1px);
    background-size:42px 42px;
    opacity:0.08;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 30%, black 20%, transparent 75%);
  }

  .bars{
    position:fixed;
    left:0; right:0; bottom:0;
    height:22vh;
    z-index:0;
    display:flex;
    align-items:flex-end;
    gap:3px;
    padding:0 4%;
    opacity:0.10;
  }
  .bars span{
    flex:1;
    background:linear-gradient(180deg, var(--line-red), transparent);
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .ring{
    position:relative;
    width:148px;
    height:148px;
    border-radius:50%;
    padding:4px;
    background:conic-gradient(from 220deg, var(--line-red), var(--silver) 40%, var(--line-red) 75%, var(--silver-dim));
    box-shadow:0 0 40px var(--line-red-soft);
    animation:spin 14s linear infinite;
  }
  @media (prefers-reduced-motion:reduce){ .ring{ animation:none; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .ring img{
    display:block;
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    background:var(--bg-0);
    border:3px solid var(--bg-0);
    animation:unspin 14s linear infinite;
  }
  @keyframes unspin{ to{ transform:rotate(-360deg); } }
  @media (prefers-reduced-motion:reduce){ .ring img{ animation:none; } }

  .name{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:clamp(2.4rem, 9vw, 3.4rem);
    letter-spacing:0.02em;
    margin:26px 0 2px;
    line-height:1;
    background:linear-gradient(180deg, var(--white) 0%, var(--silver) 55%, var(--line-red) 130%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .tagline{
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    letter-spacing:0.32em;
    color:var(--silver-dim);
    margin:0 0 34px;
  }

  .divider{
    width:52px;
    height:2px;
    background:var(--line-red);
    margin-bottom:34px;
    box-shadow:0 0 12px var(--line-red);
  }

  .actions{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    padding:18px 24px;
    border-radius:10px;
    text-decoration:none;
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:1.15rem;
    letter-spacing:0.04em;
    background:transparent;
    border:1.5px solid var(--silver-dim);
    color:var(--silver);
    transition:transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn:focus-visible{ outline:2px solid var(--white); outline-offset:3px; }

  .btn svg{ width:22px; height:22px; flex-shrink:0; }

  .btn-wa:hover{
    border-color:#25D366;
    color:#25D366;
    box-shadow:0 0 22px rgba(37,211,102,0.25);
  }
  .btn-ig:hover{
    border-color:#E1306C;
    color:#E1306C;
    box-shadow:0 0 22px rgba(225,48,108,0.25);
  }
  .btn-tg:hover{
    border-color:#27A7E7;
    color:#27A7E7;
    box-shadow:0 0 22px rgba(39,167,231,0.25);
  }

  .foot{
    margin-top:40px;
    font-size:0.78rem;
    letter-spacing:0.08em;
    color:var(--silver-dim);
  }
</style>
</head>
<body>

  <div class="bars" id="bars"></div>

    <h1 class="name">REYHAN</h1>
    <p class="tagline">ANALISIS MUDA</p>
    <div class="divider"></div>

        TELEGRAM
      </a>
    </div>

    <p class="foot">REYHAN ANALISI MUDA</p>
  </main>

<script>
  const bars = document.getElementById('bars');
  const n = 40;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('span');
    const h = 15 + Math.round(Math.sin(i * 0.7) * 20 + Math.random() * 30);
    el.style.height = h + '%';
    bars.appendChild(el);
  }
</script>

</body>
</html>
